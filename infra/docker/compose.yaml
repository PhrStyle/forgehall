# The Forgehall stack: Postgres and the bus. Run `fh setup` once first (it writes .env here).
#   docker compose -f infra/docker/compose.yaml -p forgehall up -d --build
# Isolated agents join the "forgehall-agents" network and reach the bus at http://bus:4545.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgehall
      POSTGRES_PASSWORD: forgehall_dev
      POSTGRES_DB: forgehall
    ports:
      - "127.0.0.1:5433:5432"   # for the fh CLI on the host
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgehall -d forgehall"]
      interval: 5s
      timeout: 3s
      retries: 10

  bus:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: bus }
    image: forgehall/bus:dev
    # Rootless Docker: 0:0 maps to your user. Rootful: your uid. `fh setup` picks the right one.
    user: "${FORGEHALL_UID:-1000}:${FORGEHALL_GID:-1000}"
    environment:
      DATABASE_URL: postgres://forgehall:forgehall_dev@postgres:5432/forgehall
    volumes:
      # Staging remotes, local upstreams and the admin token live in ~/.forgehall on the host.
      - "${FORGEHALL_HOME_HOST:?run fh setup first}:/data"
    ports:
      - "127.0.0.1:4545:4545"   # console and fh on this machine only
    networks: [default, agents]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

networks:
  agents:
    name: forgehall-agents

volumes:
  postgres-data:
