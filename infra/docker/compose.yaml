services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgehall
      POSTGRES_PASSWORD: forgehall_dev
      POSTGRES_DB: forgehall
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgehall -d forgehall"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Containerized bus (profile "stack"). For development you can run it on the host instead.
  bus:
    profiles: ["stack"]
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, target: bus }
    image: forgehall/bus:dev
    environment:
      DATABASE_URL: postgres://forgehall:forgehall_dev@postgres:5432/forgehall
    ports:
      - "127.0.0.1:4545:4545"
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:

# Runners join this network as "forgehall_default" and reach the bus at http://bus:4545.
