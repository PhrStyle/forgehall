services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgehall
      POSTGRES_PASSWORD: forgehall_dev
      POSTGRES_DB: forgehall
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgehall -d forgehall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
